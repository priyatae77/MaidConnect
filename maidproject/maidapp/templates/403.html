{% extends "base.html" %}
{% load static %}

{% block title %}403 Access Denied — MaidConnect{% endblock %}

{% block content %}
<div class="error-vibrant py-5 animate-fade-in">
    <!-- Background Branding -->
    <div class="hero-bg-text" style="top: 20%; color: rgba(63, 79, 207, 0.03);">403 ACCESS</div>

    <div class="container py-5 text-center position-relative" style="z-index: 2;">
        
        <div class="mb-5">
            <div class="display-1 text-vibrant mb-4 animate-bounce">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="display-1 fw-black mb-3">Access <span style="color:var(--v-pink);">Denied.</span></h1>
            <p class="h4 text-muted fw-medium mb-5">You do not have the required clearance to view this sector.</p>
        </div>

        <div class="d-flex flex-wrap justify-content-center gap-4">
            <a href="{% url 'home' %}" class="btn-vibrant px-5 py-3 fs-5">RETURN TO BASE</a>
            <a href="javascript:history.back()" class="btn btn-outline-dark px-5 py-3 fs-5 fw-black rounded-pill border-3">GO BACK</a>
        </div>

    </div>
</div>

<style>
.error-vibrant { background: #FAFAFA; min-height: 80vh; display: flex; align-items: center; }
.text-vibrant { color: var(--v-blue); }
.animate-bounce { animation: bounce 3s infinite; }
@keyframes bounce {
    0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
    40% {transform: translateY(-30px);}
    60% {transform: translateY(-15px);}
}
</style>
{% endblock %}
