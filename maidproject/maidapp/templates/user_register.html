{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="hover-card p-5 mt-4">
                <div class="text-center mb-4">
                    <div class="display-5 vibrant-blue mb-3"><i class="fa-solid fa-user-plus"></i></div>
                    <h2 class="fw-bold">Create Account</h2>
                    <p class="text-muted">Register to find the perfect helper for your family.</p>
                </div>

                <form method="POST" action="{% url 'user_register' %}">
                    {% csrf_token %}
                    
                    {{ form|crispy }}

                    <button type="submit" class="btn btn-vibrant btn-lg w-100 rounded-pill shadow-sm mt-3 mb-3">Create Account</button>
                    
                    <div class="text-center mt-3">
                        <span class="text-muted">Already have an account?</span> 
                        <a href="{% url 'login' %}" class="vibrant-text fw-bold text-decoration-none">Sign In Here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
