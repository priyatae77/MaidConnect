{% extends "base.html" %}
{% load static %}

{% block title %}Reset Password — MaidConnect{% endblock %}

{% block content %}
<section class="login-page-vibrant min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="login-card-vibrant bg-white p-5 shadow-vibrant animate-fade-in" style="border-radius: 2rem;">
                    
                    <div class="text-center mb-5">
                        <div class="icon-circle mx-auto mb-4" style="background: var(--v-blue); color: white; width: 80px; height: 80px; font-size: 2rem;">
                            <i class="fa-solid fa-lock-open"></i>
                        </div>
                        <h2 class="fw-black mb-2">New <span style="color:var(--v-blue);">Password.</span></h2>
                        <p class="text-muted">Set a strong password to secure your account.</p>
                    </div>

                    {% if messages %}
                        {% for msg in messages %}
                            <div class="alert alert-{{ msg.tags }} rounded-4 border-0 mb-4 fw-bold">
                                <i class="fa-solid fa-circle-exclamation me-2"></i> {{ msg }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST" class="vibrant-form">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label class="form-label fw-black text-uppercase small opacity-50">New Password</label>
                            <div class="position-relative">
                                <input type="password" name="password" id="newPwd" class="vibrant-input" placeholder="Min 8 characters" required>
                                <button type="button" class="pwd-toggle-btn" onclick="togglePwd('newPwd', this)">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-5">
                            <label class="form-label fw-black text-uppercase small opacity-50">Confirm Password</label>
                            <div class="position-relative">
                                <input type="password" name="confirm_password" id="confirmPwd" class="vibrant-input" placeholder="Repeat password" required>
                                <button type="button" class="pwd-toggle-btn" onclick="togglePwd('confirmPwd', this)">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn-vibrant w-100 py-3 mb-4">RESET PASSWORD NOW</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</section>

<style>
.login-page-vibrant { background: #F8FAFC; }
.vibrant-input {
    width: 100%; padding: 1.2rem; background: #F8FAFC; border: 3px solid #F1F5F9; border-radius: 1.5rem; font-weight: 600; transition: 0.3s;
}
.vibrant-input:focus { outline: none; border-color: var(--v-blue); background: white; box-shadow: 0 10px 30px rgba(63, 79, 207, 0.1); }
.pwd-toggle-btn {
    position: absolute; right: 1.2rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 1.1rem; z-index: 10;
}
.pwd-toggle-btn:hover { color: var(--v-blue); }
</style>

<script>
function togglePwd(id, btn) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
    btn.querySelector('i').className = inp.type === 'password' ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
}
</script>
{% endblock %}
