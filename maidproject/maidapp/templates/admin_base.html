{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="dash-wrapper-vibrant">

    {% block dashboard_sidebar %}
    <!-- 📱 MOBILE SIDEBAR TOGGLE 📱 -->
    <button class="btn btn-vibrant d-lg-none position-fixed"
        style="bottom: 20px; right: 20px; z-index: 1050; width: 60px; height: 60px; border-radius: 50%;"
        onclick="toggleSidebar()">
        <i class="fa-solid fa-bars"></i>
    </button>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- 🏛️ ADMIN SIDEBAR 🏛️ -->
    <aside class="dash-sidebar-vibrant" id="mobileSidebar">
        <nav class="flex-grow-1 py-4 px-3">

            <a href="{% url 'admin_dashboard' %}"
                class="v-dash-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
                <i class="fa-solid fa-satellite-dish"></i> COMMAND CENTER
            </a>

            <a href="{% url 'admin_bookings' %}"
                class="v-dash-link {% if request.resolver_match.url_name == 'admin_bookings' %}active{% endif %}">
                <i class="fa-solid fa-chart-line"></i> ENTERPRISE REPORTS
            </a>

            <a href="{% url 'manage_users' %}"
                class="v-dash-link {% if request.resolver_match.url_name == 'manage_users' or request.resolver_match.url_name == 'manage_user_detail' %}active{% endif %}">
                <i class="fa-solid fa-users"></i> CLIENT REGISTRY
            </a>

            <a href="{% url 'manage_workers' %}"
                class="v-dash-link {% if request.resolver_match.url_name == 'manage_workers' or request.resolver_match.url_name == 'manage_worker_detail' %}active{% endif %}">
                <i class="fa-solid fa-user-gear"></i> PARTNER MATRIX
            </a>

            <a href="{% url 'admin_complaints' %}"
                class="v-dash-link {% if request.resolver_match.url_name == 'admin_complaints' %}active{% endif %}">
                <i class="fa-solid fa-triangle-exclamation"></i> RESOLVE ISSUES
            </a>

            <a href="{% url 'offer_management' %}"
                class="v-dash-link {% if 'offer' in request.path %}active{% endif %}">
                <i class="fa-solid fa-tags"></i> SMART OFFERS
            </a>

            <a href="javascript:void(0)" onclick="showToast('Help Center')" class="v-dash-link">
                <i class="fa-solid fa-circle-question"></i> HELP CENTER
            </a>

        </nav>

        <!-- 🚪 LOGOUT BUTTON 🚪 -->
        <div class="mt-auto p-3">
            <a href="{% url 'logout' %}" class="v-dash-link text-danger logout-btn-sidebar">
                <i class="fa-solid fa-power-off"></i> LOGOUT
            </a>
        </div>
    </aside>
    {% endblock %}

    <!-- ⚡ MAIN CONTENT ⚡ -->
    <main class="dash-main-vibrant">
        <!-- 🌌 DYNAMIC PARALLAX BACKGROUND 🌌 -->
        <div class="dash-parallax-container">
            <style>
                #dynamic-parallax-bg {
                    background-image: url('{% block dashboard_bg_url %}{% static "images/home_bg.png" %}{% endblock %}');
                }
            </style>
            <div id="dynamic-parallax-bg" class="dash-parallax-bg"></div>
        </div>

        <div class="dash-content-relative">
            {% block dashboard_content %}{% endblock %}
        </div>
    </main>
</div>

<div id="vibrant-toast" class="vibrant-toast"></div>

<style>
    .dash-wrapper-vibrant {
        display: flex;
        flex-direction: row;
        width: 100%;
        align-items: flex-start;
        min-height: calc(100vh - 85px);
        background: #f4f7fe;
        position: relative;
    }

    .dash-sidebar-vibrant {
        width: 220px;
        min-width: 220px;
        background: white;
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 85px;
        height: calc(100vh - 85px);
        border-right: 1px solid #edf2f7;
        z-index: 100;
        overflow-y: auto;
    }

    .dash-main-vibrant {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
        position: relative;
        z-index: 1;
    }

    .dash-parallax-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        z-index: -1;
    }

    .dash-parallax-bg {
        position: absolute;
        top: -10%;
        left: -10%;
        width: 120%;
        height: 120%;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0.15;
        filter: blur(2px);
        animation: dashboardFloat 30s infinite ease-in-out;
    }

    .dash-content-relative {
        position: relative;
        z-index: 2;
        padding: 20px;
    }

    @keyframes dashboardFloat {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-2%, 2%) scale(1.05); }
    }

    .v-dash-link {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 18px;
        margin-bottom: 4px;
        color: #718096;
        font-weight: 700;
        text-decoration: none;
        transition: all 0.2s ease;
        font-size: 12px;
        letter-spacing: 0.3px;
        border-radius: 0 50px 50px 0;
        margin-right: 12px;
    }

    .v-dash-link i {
        font-size: 14px;
        width: 18px;
        text-align: center;
        flex-shrink: 0;
    }

    .v-dash-link:hover {
        color: #3182ce;
        background: #ebf8ff;
    }

    .v-dash-link.active {
        background: #ebf8ff;
        color: #3182ce;
        border-left: 4px solid #3182ce;
    }

    .logout-btn-sidebar {
        border-radius: 12px !important;
        margin-right: 0 !important;
        background: rgba(255, 117, 143, 0.08) !important;
        color: #FF758F !important;
        transition: all 0.3s ease;
    }

    .logout-btn-sidebar:hover {
        background: #FF758F !important;
        color: white !important;
        box-shadow: 0 4px 15px rgba(255, 117, 143, 0.3);
        transform: translateY(-2px);
    }

    footer.footer-vibrant {
        margin-left: 0 !important;
        position: relative;
        z-index: 1000;
    }

    .vibrant-toast {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: #3182ce;
        color: white;
        padding: 1rem 2rem;
        border-radius: 1rem;
        font-weight: 800;
        box-shadow: 0 10px 30px rgba(49, 130, 206, 0.2);
        display: none;
        z-index: 9999;
    }

    @media (max-width: 991px) {
        .dash-sidebar-vibrant {
            position: fixed;
            left: -220px;
            transition: all 0.3s ease;
            z-index: 1040;
        }

        .dash-sidebar-vibrant.open {
            left: 0;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.1);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 85px;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1030;
        }

        .sidebar-overlay.open { display: block; }

        .dash-main-vibrant { padding: 15px; }
    }
</style>

<script>
    function showToast(message) {
        const toast = document.getElementById("vibrant-toast");
        toast.innerText = message;
        toast.style.display = "block";
        setTimeout(() => { toast.style.display = "none"; }, 4000);
    }

    function toggleSidebar() {
        document.getElementById('mobileSidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('open');
    }
</script>
{% endblock %}
