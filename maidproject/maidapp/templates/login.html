{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="hover-card p-5 mt-5">
                <div class="text-center mb-4">
                    <div class="display-4 vibrant-teal mb-3"><i class="fa-solid fa-right-to-bracket"></i></div>
                    <h2 class="fw-bold">Welcome Back</h2>
                    <p class="text-muted">Please sign in to your MaidConnect account</p>
                </div>

                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-medium">Username</label>
                        <input type="text" name="username" class="form-control form-control-lg rounded-3 bg-light border-0" required placeholder="Enter username">
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-medium">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg rounded-3 bg-light border-0" required placeholder="Enter password">
                    </div>

                    <button type="submit" class="btn btn-vibrant btn-lg w-100 rounded-pill shadow-sm mb-3">Sign In</button>
                    
                    <div class="text-center mt-3">
                        <span class="text-muted">Don't have an account?</span><br>
                        <a href="{% url 'user_register' %}" class="vibrant-text fw-bold text-decoration-none me-3">Register as User</a> | 
                        <a href="{% url 'worker_register' %}" class="vibrant-text fw-bold text-decoration-none ms-3">Register as Worker</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
